name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Catches dangling and duplicate requirement identifiers. Matters most
      # while parallel design sessions are both editing prd.md.
      - name: Documentation integrity
        run: python3 scripts/check_docs.py

      # Every implementation commit must cite a requirement that exists.
      - name: Traceability
        run: python3 scripts/check_traceability.py

      # Skips until DATABASE_URL is set; live the moment a schema exists.
      - name: Database invariants
        run: python3 scripts/check_db_invariants.py
